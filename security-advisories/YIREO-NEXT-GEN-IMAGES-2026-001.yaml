summary: 'Path traversal in image URL resolution allows converting files outside of the public folder'
details: |-
  ### Impact

  `Yireo\NextGenImages\Util\UrlConvertor::getFilenameFromUrl()` turns the URL of every `<img>` tag in the frontend HTML into a file path by appending it to the `pub` folder. It did not normalise `..` segments and it matched store URLs anywhere in the string instead of as a prefix. An image URL like `/media/../../app/some/image.jpg` therefore resolved to a file outside of the public folder, and the installed convertor (like `yireo/magento2-webp2`) read that file and wrote a converted copy.

  Anyone who can get an `<img src>` or `srcset` value into a rendered frontend page, including through correctly escaped output of user input, can:

  - make the server convert any readable `.jpg`/`.png` file on the server and write a converted file (like `.webp`) next to it, when that folder is writable by the web server;
  - find out whether such a file exists, because a `<picture>` element is only generated when it does;
  - when `yireo_nextgenimages/settings/target_directory` is set to the cache folder, get a publicly accessible converted copy of images in media folders that Magento denies access to (`media/customer`, `media/customer_address`, `media/custom_options`, `media/downloadable`, `media/import`). The URL of that copy is printed in the `<source>` tag.

  ### Patches

  Fixed in **0.5.18**: resolved paths must stay inside the `pub`, media or static folder, store URLs only match as a prefix, and stream wrapper URLs are rejected.

  ```
  composer require yireo/magento2-next-gen-images:^0.5.18
  ```

  Users of `yireo/magento2-webp2` should also upgrade to 0.14.5, which additionally refuses to convert files outside of the media and static folders and inside the protected media folders.

  ### Workarounds

  Disable image creation with `bin/magento config:set yireo_nextgenimages/settings/convert_images 0`, or disable the module with `yireo_nextgenimages/settings/enabled 0`, and flush the cache.

  ### References

  - Fix: https://github.com/yireo/Yireo_NextGenImages/commit/6d9230a
  - Release: https://github.com/yireo/Yireo_NextGenImages/releases/tag/0.5.18
